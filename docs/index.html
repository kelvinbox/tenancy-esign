<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tenancy e-sign</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="hdr">
  <button class="back" id="backBtn" hidden aria-label="Back">&#8249;</button>
  <div class="tile" id="hdrTile" style="width:38px;height:38px;flex-basis:38px;font-size:20px;background:rgba(255,255,255,.18)">&#9997;&#65039;</div>
  <div class="grow">
    <h1 id="hdrTitle">Agreements</h1>
    <div class="sub" id="hdrSub">Tenancy e-sign</div>
  </div>
  <span id="demoBadge" class="demo-badge" hidden>DEMO</span>
</header>

<main class="wrap" id="app"></main>

<nav class="tabbar" id="tabbar">
  <button data-tab="list" class="on"><span class="ic">&#128221;</span>Agreements<span class="badge" id="badgeOpen" hidden></span></button>
  <button data-tab="new"><span class="ic">&#10133;</span>New</button>
  <button data-tab="outbox" id="tabOutbox" hidden><span class="ic">&#128236;</span>Outbox<span class="badge" id="badgeOutbox" hidden></span></button>
  <button data-tab="verify"><span class="ic">&#128269;</span>Verify</button>
  <button data-tab="settings"><span class="ic">&#9881;&#65039;</span>Setup</button>
</nav>

<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/agreement-template.js"></script>
<script src="js/demo-data.js"></script>
<script src="js/demo-backend.js"></script>
<script src="js/api.js"></script>
<script src="js/console.js"></script>
</body>
</html>
