<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tenancy e-sign</title>
<link rel="stylesheet" href="css/app.css?v=0.15.3">
<script>
  /* Never fail silently: show any script error on screen. */
  (function () {
    function show(msg) {
      var d = document.getElementById("jsErr");
      if (!d) {
        d = document.createElement("div");
        d.id = "jsErr";
        d.setAttribute("role", "alert");
        d.style.cssText = "position:fixed;left:8px;right:8px;top:8px;z-index:99;background:#b91c1c;color:#fff;padding:12px 14px;border-radius:10px;font:14px/1.4 -apple-system,Segoe UI,Arial,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.25)";
        (document.body || document.documentElement).appendChild(d);
      }
      d.textContent = "Something went wrong: " + msg + ". Reload the page. If it keeps happening, close the tab and open the link again.";
    }
    // Only this page's own scripts. A bare "Script error." (or an error from another site) comes from the email app's
    // built-in browser or a browser extension, not from this page, so it is logged and otherwise ignored.
    window.addEventListener("error", function (e) {
      var f = String(e.filename || "");
      if (/^Script error\.?$/i.test(String(e.message || "")) || (f && f.indexOf(location.origin) !== 0)) { try { console.warn("Ignored an error from outside this page:", e.message, f); } catch (x) {} return; }
      show(e.message || "a script failed to load");
    });
    window.addEventListener("unhandledrejection", function (e) { show((e.reason && e.reason.message) || "unexpected error"); });
  })();
</script>
</head>

  </div>
  <span id="demoBadge" class="demo-badge" hidden>DEMO</span>
</header>

<main class="wrap" id="app"></main>

<nav class="tabbar" id="tabbar">
  <button data-tab="list" class="on"><span class="ic">&#128221;</span>Agreements<span class="badge" id="badgeOpen" hidden></span></button>
  <button data-tab="new"><span class="ic">&#10133;</span>New</button>
  <button data-tab="outbox" id="tabOutbox" hidden><span class="ic">&#128236;</span>Outbox<span class="badge" id="badgeOutbox" hidden></span></button>
